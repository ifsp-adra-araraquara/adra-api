spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=jdbc:postgresql://127.0.0.1:54322/postgres?currentSchema=adra&stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres

adra.supabase.url=http://127.0.0.1:54321
adra.supabase.jwks-uri=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
adra.supabase.service-key=${SUPABASE_SERVICE_KEY}
adra.jwt.segredo=${ADRA_JWT_SEGREDO}

adra.frontend.url=http://localhost:4200

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect