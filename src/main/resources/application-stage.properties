spring.config.import=optional:file:.env.stage[.properties]

spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?currentSchema=adra&stringtype=unspecified
spring.datasource.username=postgres.moorxvcnxesniwaaaksm
spring.datasource.password=${SUPABASE_PASSWORD}

adra.supabase.url=https://moorxvcnxesniwaaaksm.supabase.co
adra.supabase.jwks-uri=https://moorxvcnxesniwaaaksm.supabase.co/auth/v1/.well-known/jwks.json
adra.supabase.service-key=${SUPABASE_SERVICE_KEY}
adra.jwt.segredo=${ADRA_JWT_SEGREDO}

spring.mail.host=smtp-relay.brevo.com
# A DigitalOcean bloqueia a saida nas portas 25, 465 e 587.
spring.mail.port=2525
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
adra.email.remetente-email=naoresponda@mail.duxpe.dev
adra.email.remetente-nome=ADRA Araraquara
adra.frontend.url=http://localhost:4200

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# Limite do pool para não exceder o limite de 15 conexões do pooler do Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Dialeto explícito para inicialização estável sem depender de metadata JDBC sob alta carga
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect