spring.application.name=api

adra.jwt.expiracao=1h
adra.cors.origens=http://localhost:4200

server.shutdown=graceful

# E-mail fora do ar nao deixa a API indisponivel.
management.health.mail.enabled=false
spring.flyway.out-of-order=true
spring.flyway.schemas=adra
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260920123202
spring.profiles.active=stage
adra.arquivos.provedor=SUPABASE
adra.arquivos.supabase.bucket=adra-arquivos
adra.arquivos.url-validade=5m

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=10MB