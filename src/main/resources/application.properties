spring.application.name=api

adra.jwt.expiracao=1h
adra.cors.origens=http://localhost:4200

server.shutdown=graceful
spring.jpa.open-in-view=false

# E-mail fora do ar nao deixa a API indisponivel.
management.health.mail.enabled=false
spring.flyway.out-of-order=true
spring.flyway.schemas=adra
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260920123202
spring.profiles.active=stage
adra.arquivos.provedor=SUPABASE
adra.arquivos.supabase.bucket=adra-arquivos
adra.arquivos.url-validade=5m

spring.servlet.multipart.max-file-size=3MB
# Pré-cadastro manda até 5 anexos de 2 MB (comprovante + 2 do atendido + 2 do responsável) + campos.
spring.servlet.multipart.max-request-size=12MB

# FT-14: notificacoes. O e-mail sai em um resumo por pessoa, uma vez por dia, no
# horario do cron. Desligado, nada sai por e-mail; o sino continua funcionando.
adra.notificacao.cron=0 0 7 * * *
adra.notificacao.email.ligado=${NOTIFICACAO_EMAIL_LIGADO:false}
# O Brevo gratuito manda 300 por dia, somando a redefinicao de senha e o Supabase Auth.
adra.notificacao.email.limite-diario=250
# Pendente ha mais dias que isso (envio desligado, limite estourado) nao sai mais.
adra.notificacao.email.janela-dias=3
adra.notificacao.retencao-dias=180
