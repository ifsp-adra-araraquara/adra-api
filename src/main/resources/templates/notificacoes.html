<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos do dia — ADRA Araraquara</title>
</head>

<body style="margin:0; padding:0; background-color:#F4F5F5; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#F4F5F5; padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                    style="max-width:520px; background-color:#FFFFFF; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">

                    <!-- Cabeçalho -->
                    <tr>
                        <td style="background-color:#007B5F; padding:28px 32px; text-align:center;">
                            <span style="font-size:20px; font-weight:700; color:#FFFFFF; letter-spacing:0.5px;">ADRA
                                ARARAQUARA</span>
                        </td>
                    </tr>

                    <!-- Corpo -->
                    <tr>
                        <td style="padding:36px 32px 28px;">
                            <h1 style="margin:0 0 16px; font-size:19px; color:#2D2F30; font-weight:700;">
                                Olá, {{ .Nome }}
                            </h1>
                            <p style="margin:0 0 12px; font-size:14px; line-height:1.6; color:#54585A;">
                                {{ .Introducao }}
                            </p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                                {{ .Itens }}
                            </table>

                            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
                                <tr>
                                    <td style="border-radius:8px; background-color:#007B5F;">
                                        <a href="{{ .SiteURL }}/notificacoes"
                                            style="display:inline-block; padding:13px 28px; font-size:14px; font-weight:700; color:#FFFFFF; text-decoration:none; border-radius:8px;">
                                            Abrir o sistema
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Rodapé -->
                    <tr>
                        <td style="background-color:#F4F5F5; padding:20px 32px; text-align:center;">
                            <p style="margin:0; font-size:11px; color:#8A8D8F;">
                                Este é um e-mail automático — não responda. Ele sai uma vez por dia, só quando há
                                aviso novo para você.
                            </p>
                            <p style="margin:8px 0 0; font-size:11px; color:#8A8D8F;">
                                ADRA Araraquara · Sistema de Gestão · Protótipo acadêmico — IFSP Campus Araraquara
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
